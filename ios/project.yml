name: TravelCopilot
options:
  bundleIdPrefix: dev.buildhybridai
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.13.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    # Raise for every TestFlight upload.
    CURRENT_PROJECT_VERSION: "2"
    # Apple Developer team (Team IDs aren't secret). Xcode signs automatically.
    DEVELOPMENT_TEAM: WGAA2WP5T4
    CODE_SIGN_STYLE: Automatic
targets:
  TravelCopilot:
    type: application
    platform: iOS
    sources:
      - path: TravelCopilot
        excludes:
          - "Resources/GoogleService-Info.plist"
      - path: Shared
    postBuildScripts:
      - name: Copy GoogleService-Info.plist if present
        basedOnDependencyAnalysis: false
        # Declaring the generated Info.plist as input makes Xcode run this after it's written;
        # otherwise the Google URL scheme added below gets overwritten and Google sign-in can't return.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          SRC="${SRCROOT}/TravelCopilot/Resources/GoogleService-Info.plist"
          if [ -f "$SRC" ]; then
            cp "$SRC" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/"
            # Google Sign-In returns to the app through the REVERSED_CLIENT_ID URL scheme.
            REV=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "$SRC" 2>/dev/null || true)
            PL="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
            if [ -n "$REV" ] && [ -f "$PL" ]; then
              # Keep the app's own travelcopilot:// scheme (entry 0); Google's goes in entry 1.
              /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes:1" "$PL" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1 dict" -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes array" -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string $REV" "$PL"
            fi
          else
            echo "warning: GoogleService-Info.plist missing - Firebase disabled (see SETUP.md)"
          fi
          # Apple Wallet pass certificate (never in git): copied in when present. See SETUP.md.
          WALLET="${SRCROOT}/TravelCopilot/Resources/Wallet"
          for f in PassCertificate.p12 PassCertificate.password AppleWWDRCAG4.cer; do
            if [ -f "$WALLET/$f" ]; then cp "$WALLET/$f" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/"; fi
          done
    entitlements:
      path: TravelCopilot/TravelCopilot.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Emergency card: read blood type and shared medications (read only).
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # App Check on TestFlight / App Store builds (debug builds use the debug token).
        com.apple.developer.devicecheck.appattest-environment: production
    info:
      path: TravelCopilot/Info.plist
      properties:
        CFBundleDisplayName: Travel Copilot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only standard HTTPS encryption, so App Store Connect doesn't ask on every upload.
        ITSAppUsesNonExemptEncryption: false
        # Live Activity and notification buttons open the app here (travelcopilot://ask, ://trip, ://taxi, ://map).
        CFBundleURLTypes:
          - CFBundleURLName: dev.buildhybridai.travelcopilot
            CFBundleURLSchemes: [travelcopilot]
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Shows where you are on your saved trip map, even offline (GPS needs no internet).
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: Fills your emergency card with your blood type and the medications you choose to share, and counts your steps for your trip summary when you ask. Read only; stays on this iPhone.
        NSHealthUpdateUsageDescription: Travel Copilot doesn't write to Health.
        NSMicrophoneUsageDescription: Lets you speak to Blue instead of typing, when you tap the mic or Talk.
        NSSpeechRecognitionUsageDescription: Turns what you say to Blue into text, on this iPhone when it can.
        NSCameraUsageDescription: Lets you take a photo to show Blue while you plan.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.buildhybridai.travelcopilot
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: Firebase
        product: FirebaseAILogic
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: TravelCopilotWidgets
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseRemoteConfig
  TravelCopilotWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TravelCopilotWidgets
      - path: Shared
    info:
      path: TravelCopilotWidgets/Info.plist
      properties:
        CFBundleDisplayName: Travel Copilot
        # Must match the app's version and build, or App Store Connect warns.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.buildhybridai.travelcopilot.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES
  TravelCopilotTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TravelCopilotTests]
    dependencies:
      - target: TravelCopilot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TravelCopilot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TravelCopilot"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  TravelCopilot:
    build:
      targets:
        TravelCopilot: all
        TravelCopilotTests: [test]
    test:
      targets: [TravelCopilotTests]
